<!DOCTYPE html>
<html>
<head>
  <title>hatefuse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    #spin {
      width: 700px;
      max-width: 90vw;
      height: auto;
      display: block;
    }

    #enter {
      width: 600px;
      max-width: 85vw;
      height: auto;
      cursor: pointer;
      margin-top: 30px;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>

  <div id="intro" class="screen active">
    <img id="spin" src="spin.gif" alt="3D Visual" />
    <img id="enter" src="enter.png" alt="Enter" />
  </div>

  <div id="main" class="screen">
    <h1 style="letter-spacing: 2px;">hatefuse</h1>
  </div>

  <audio id="bgMusic" loop>
    <source src="preview.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const intro = document.getElementById("intro");
    const main = document.getElementById("main");
    const enter = document.getElementById("enter");
    const music = document.getElementById("bgMusic");

    function enterSite() {
      music.play().catch(() => {});
      intro.classList.remove("active");
      main.classList.add("active");
    }

    enter.addEventListener("click", enterSite);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enterSite();
    });
  </script>

</body>
</html>
